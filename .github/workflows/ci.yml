name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build and test
        run: npm test

  api:
    name: API quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --project services/api --locked --extra dev --extra retrieval

      - name: Lint API
        run: uv run --project services/api ruff check services/api

      - name: Test API
        run: >-
          uv run --project services/api pytest
          --cov=arxiv_recsys
          --cov-report=term-missing
          services/api/tests

      - name: Run fixture retrieval benchmark
        run: >-
          uv run --project services/api python
          services/api/benchmarks/run_retrieval.py
          --repetitions 25
          --output ${{ runner.temp }}/retrieval-benchmark.json

      - name: Upload retrieval benchmark
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-benchmark
          path: ${{ runner.temp }}/retrieval-benchmark.json
          retention-days: 14
